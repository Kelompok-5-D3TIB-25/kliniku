name: kliniku

services:
  app:
    image: shinsenter/laravel:php8.4-nginx
    container_name: kliniku
    restart: "no"
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      TZ: Asia/Jakarta
      APP_URL: http://localhost:8080
      ASSET_URL: http://localhost:8080
      APP_TIMEZONE: Asia/Jakarta
      LARAVEL_AUTO_MIGRATION: 0
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kliniku}
      DB_USERNAME: ${DB_USERNAME:-kliniku}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: mysql:8.4.11
    container_name: kliniku-db
    restart: "no"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      TZ: Asia/Jakarta
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-kliniku}
      MYSQL_USER: ${DB_USERNAME:-kliniku}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

networks:
  backend:

volumes:
  db-data:
